<div class="p-4">
  <button mat-raised-button color="primary" (click)="openDialog()">Add New Mapping</button>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 mt-4">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let element">{{ element.id }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let element">{{ element.roleName }}</td>
    </ng-container>

    <ng-container matColumnDef="menus">
      <th mat-header-cell *matHeaderCellDef>Menus</th>
      <td mat-cell *matCellDef="let element">{{ element.menuNames.join(', ') }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="accent" (click)="openDialog(element)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
